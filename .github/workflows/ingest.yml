name: Daily arXiv Ingestion

on:
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6:00 AM UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

concurrency:
  group: ingestion
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-cache-minilm-clip-v1
          restore-keys: |
            ${{ runner.os }}-hf-cache-

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python ingestion/ingest.py

      # GitHub disables scheduled workflows after 60 days without commits,
      # which would stop ingestion and let Supabase auto-pause. Commit a heartbeat.
      - name: Keep repo active
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last_ingest_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_ingest_run.txt
          git commit -m "chore: ingestion heartbeat [skip ci]"
          git push
